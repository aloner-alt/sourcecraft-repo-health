services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL}
      YANDEX_CALLBACK_URL: https://${APP_DOMAIN:?Set APP_DOMAIN}/api/auth/yandex/callback
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      SOURCECRAFT_CLI_PATH: /opt/sourcecraft/bin/src
      SOURCECRAFT_TOKEN: ${SOURCECRAFT_TOKEN}
    command: ["sh", "-c", "pnpm prisma:deploy && pnpm start:prod"]

  frontend:
    build:
      context: ./frontend
      args:
        API_BASE_URL: ${API_BASE_URL:-http://localhost:3000/api}
        NEXT_PUBLIC_API_BASE_URL: ${API_BASE_URL:-http://localhost:3000/api}
    restart: unless-stopped
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://localhost:3000/api}
      NEXT_PUBLIC_API_BASE_URL: ${API_BASE_URL:-http://localhost:3000/api}
    depends_on:
      - backend
