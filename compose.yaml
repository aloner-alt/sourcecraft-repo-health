services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: repo_health
      POSTGRES_USER: repo_health
      POSTGRES_PASSWORD: repo_health
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repo_health -d repo_health"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://repo_health:repo_health@postgres:5432/repo_health?schema=public
      REDIS_HOST: redis
      FRONTEND_URL: http://localhost:3001
      SCHEDULE_ENABLED: "true"
      ANALYSIS_INTERVAL_HOURS: "24"
    command: ["sh", "-c", "pnpm prisma:deploy && pnpm start:prod"]
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        API_BASE_URL: http://backend:3000/api
        NEXT_PUBLIC_API_BASE_URL: http://localhost:3000/api
    environment:
      API_BASE_URL: http://backend:3000/api
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3000/api
    ports:
      - "3001:3001"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
